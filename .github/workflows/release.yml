name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Match the tag to VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is version '${GITHUB_REF_NAME#v}' but VERSION contains '$version'"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  desktop:
    needs: release
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: desktop-macos-dmg, arch: arm64 }
          - { runner: macos-latest, target: desktop-macos-dmg, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        shell: bash
        env:
          FUDA_GITHUB_BOARDS: ${{ vars.FUDA_GITHUB_BOARDS }}
          FUDA_AZURE_BOARDS: ${{ vars.FUDA_AZURE_BOARDS }}
        run: |
          make ${{ matrix.target }} ARCH=${{ matrix.arch }} GITHUB_CLIENT_ID=${{ vars.FUDA_GITHUB_CLIENT_ID }} GITHUB_APP_SLUG=${{ vars.FUDA_GITHUB_APP_SLUG }} GITHUB_BOARDS="$FUDA_GITHUB_BOARDS" AZURE_BOARDS="$FUDA_AZURE_BOARDS"
      - name: Pack and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=fuda-desktop_darwin_${{ matrix.arch }}
          cd bin
          gh release upload "$GITHUB_REF_NAME" "$name.dmg" --clobber

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
