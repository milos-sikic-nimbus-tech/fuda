name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    # The desktop package links Wails through cgo; macOS has the system frameworks it needs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make check
